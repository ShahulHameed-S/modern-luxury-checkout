[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v -s --strict-markers
filterwarnings =
    ignore::pytest.PytestRemovedIn10Warning
    ignore::DeprecationWarning
markers =
    mandatory: Mandatory test cases specified by challenge requirements
    extended: Additional regression and edge-case test cases
